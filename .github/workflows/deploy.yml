name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup pnpm & Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          
      - name: Install dependencies
        run: pnpm install

      - name: Check Formatting & Linting
        run: pnpm lint

      - name: Type Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5